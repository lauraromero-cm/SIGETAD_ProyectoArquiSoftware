services:
  db:
    image: postgres:16-alpine
    container_name: sigetad_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigetad_db}
      POSTGRES_USER: ${POSTGRES_USER:-sigetad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigetad_pass}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigetad_user} -d ${POSTGRES_DB:-sigetad_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  bus:
    build: ./backend
    container_name: sigetad_bus
    command: python -m bus.bus_server
    environment:
      BUS_HOST: 0.0.0.0
      BUS_PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: sigetad_backend
    command: sh -c "python manage.py migrate && python manage.py import_datos && python manage.py seed_data && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/uploads
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigetad_db}
      POSTGRES_USER: ${POSTGRES_USER:-sigetad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigetad_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      BUS_HOST: bus
      BUS_PORT: 5000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      bus:
        condition: service_started

  service_usuarios:
    build: ./backend
    command: sh -c "python manage.py run_soa_service USUAR"
    volumes:
      - ./backend:/app
    environment: &backend_env
      POSTGRES_DB: ${POSTGRES_DB:-sigetad_db}
      POSTGRES_USER: ${POSTGRES_USER:-sigetad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigetad_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      BUS_HOST: bus
      BUS_PORT: 5000
    depends_on:
      db:
        condition: service_healthy
      bus:
        condition: service_started

  service_vacantes:
    build: ./backend
    command: sh -c "python manage.py run_soa_service VACAN"
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      bus:
        condition: service_started

  service_candidatos:
    build: ./backend
    command: sh -c "python manage.py run_soa_service CANDI"
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      bus:
        condition: service_started

  service_postulaciones:
    build: ./backend
    command: sh -c "python manage.py run_soa_service POSTU"
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      bus:
        condition: service_started

  service_evaluaciones:
    build: ./backend
    command: sh -c "python manage.py run_soa_service EVALU"
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      bus:
        condition: service_started

  service_historial:
    build: ./backend
    command: sh -c "python manage.py run_soa_service HISTO"
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      bus:
        condition: service_started

  service_documentos:
    build: ./backend
    command: sh -c "python manage.py run_soa_service DOCUM"
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      bus:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: sigetad_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend
